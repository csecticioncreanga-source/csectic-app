<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <title>CSECTIC</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/logo_192.png">
  <link rel="apple-touch-icon" href="assets/logo_192.png">
  <link rel="stylesheet" href="style.css?v=20261023">
</head>
<body>
  <div id="app" class="no-anim" data-view="onboarding">

    <!-- Logo unic: stă mare pe primul ecran și se micșorează sus în aplicație -->
    <div id="brandLogo"></div>

    <!-- Ecran 1: alegerea clasei (apare doar prima dată) -->
    <section id="onboarding" class="screen">
      <div class="pill title-pill">Selectează-ți Clasa</div>
      <div class="glass picker">
        <div class="wheel" id="wheel"></div>
      </div>
      <div class="go-row">
        <button class="pill back-btn hidden" id="backBtn">Înapoi</button>
        <button class="pill go-btn" id="continueBtn">Înainte</button>
      </div>
    </section>

    <!-- Aplicația principală -->
    <section id="main" class="screen">
      <header class="top">
        <button class="class-chip" id="classChip" aria-label="Schimbă clasa"></button>
      </header>

      <main class="content" id="content">
        <!-- Orar -->
        <div class="panel" id="panel-orar">
          <div class="now-strip" id="nowStrip"></div>

          <div class="announce" id="announce">
            <button class="announce-head" id="announceHead" aria-expanded="false"></button>
            <div class="announce-body" id="announceBody"></div>
          </div>

          <div class="pill daybar" id="dayBar"><span class="ind" id="dayInd"></span></div>
          <div class="glass card" id="scheduleCard"></div>
        </div>

        <!-- Activități -->
        <div class="panel hidden" id="panel-activitati">
          <div class="cards" id="activitiesList"></div>
        </div>

        <!-- Proiecte -->
        <div class="panel hidden" id="panel-proiecte">
          <div class="cards" id="projectsList"></div>
        </div>
      </main>

      <nav id="nav"></nav>
    </section>

  </div>

  <script src="data.js?v=20261023"></script>
  <script src="app.js?v=20261023"></script>
</body>
</html>
