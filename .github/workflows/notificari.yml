# Notificări CSECTIC — 100% gratuit pe GitHub Actions (repo public: minute nelimitate).
#
# De ce buclă: cronul GitHub e „best effort” pe conturile noi — câteva rulări pe
# zi, la ore aleatorii. Cu ferestre de 5-10 minute (pauza de la :50, seara la
# 19:00) aproape totul se rata. Acum un job rulează ~5 ore și verifică la fiecare
# 5 minute, iar la final își pornește singur următorul rulaj (lanț) → acoperire
# continuă, fără cron extern, fără Apps Script și fără să plătești nimic.
#
# - schedule     → buclă: salut dimineața + memento la fiecare pauză + programul de mâine
# - push pe data.js / timetable_*.js → „Anunț nou”
# - workflow_dispatch:
#     mode: schedule  → pornește bucla reală
#     mode: test      → notificare de probă
#     mode: announce  → retrimite anunțul curent
#     mode: preview   → trimite EXACT ce s-ar trimite la ora din „now”, fără să
#                       consume mesajul real (nu atinge starea reală)
name: Notificări

on:
  push:
    paths:
      - "data.js"
      - "timetable_*.js"
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "schedule | test | announce | preview"
        default: "schedule"
      now:
        description: "Simulare oră România (ex. 2026-11-08T19:02) — lasă gol pentru ora reală"
        default: ""
      dry:
        description: "1 = doar afișează mesajele, fără să trimită"
        default: ""

permissions:
  contents: write      # pentru fișierul de stare (branch notify-state)
  actions: write       # ca un rulaj să-și poată porni singur următorul rulaj

# Rulările „de probă” nu stau la coadă după bucla de 5 ore.
concurrency:
  group: notificari-${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'test' || github.event.inputs.mode == 'preview' || github.event.inputs.mode == 'announce')) && 'manual' || 'loop' }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: webpush-v1

      - name: Instalează web-push
        run: npm install --no-audit --no-fund --silent
        working-directory: scripts

      - name: Trimite notificările
        working-directory: scripts
        env:
          NOTIFY_MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'announce' || 'schedule') }}
          NOTIFY_NOW: ${{ github.event.inputs.now }}
          NOTIFY_DRY: ${{ github.event.inputs.dry }}
          SUBS_URL: ${{ secrets.SUBS_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$NOTIFY_MODE" = "preview" ]; then
            # Previzualizarea trimite MEREU: fără token, scriptul nu citește și nu
            # scrie starea din repo → testezi de câte ori vrei, fără să "consumi"
            # mesajul real de la ora aceea.
            GITHUB_TOKEN= STATE_BRANCH=preview-state node notify.js
            exit 0
          fi
          if [ "$NOTIFY_MODE" != "schedule" ] || [ -n "$NOTIFY_NOW" ] || [ -n "$NOTIFY_DRY" ]; then
            node notify.js
            exit 0
          fi
          # 60 de pași × 5 minute ≈ 5 ore de acoperire, la fix
          for i in $(seq 1 60); do
            echo "── pas $i/60 ── $(date -u '+%H:%M UTC')"
            node notify.js || echo "pas $i: eroare nefatală, continuăm"
            if [ "$i" -lt 60 ]; then sleep 285; fi
          done
          echo "Bucla s-a încheiat — pornesc următorul rulaj."

      # AUTONOMIE: fiecare rulaj își lansează singur continuarea, deci șirul nu
      # depinde de cronul GitHub (tăiat pe conturi noi), de Apps Script sau de noi.
      # Rulările de probă (test/preview/announce) și push-urile NU se lansează.
      - name: Pornește următorul rulaj (lanț)
        if: always() && github.event_name != 'push' && github.event.inputs.mode != 'test' && github.event.inputs.mode != 'preview' && github.event.inputs.mode != 'announce'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/chain.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"main","inputs":{"mode":"schedule"}}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/notificari.yml/dispatches")
          echo "lanț → HTTP $code"
          if [ "$code" != "204" ]; then echo "LANȚUL A EȘUAT:"; cat /tmp/chain.json; exit 1; fi
